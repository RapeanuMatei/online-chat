<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FriendChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/groups.css" />
</head>
<body>
  <!-- Create / edit profile -->
  <div class="join hidden" id="profileModal">
    <form class="join-card" id="profileForm">
      <h1 id="profileTitle">Create your profile</h1>
      <p>Pick a name and a picture. Your friends will see them in the chat.</p>
      <label class="avatar-pick" for="avatarInput" title="Choose a picture">
        <img id="avatarPreview" alt="" hidden />
        <span id="avatarHint">Add a picture</span>
      </label>
      <input id="avatarInput" type="file" accept="image/*" hidden />
      <input id="nameInput" maxlength="20" placeholder="Your name" autocomplete="off" required />
      <button type="submit" id="saveBtn">Join the chat</button>
      <button type="button" class="ghost" id="cancelBtn" hidden>Cancel</button>
    </form>
  </div>

  <!-- Pop-up used for: new group, group settings, invitations -->
  <div class="join hidden" id="sheet"><div class="join-card" id="sheetCard"></div></div>

  <!-- Full-size picture viewer -->
  <div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt="" /></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <h2>FriendChat</h2>
        <button type="button" class="icon small" id="newGroupBtn" aria-label="Create a group">＋</button>
      </div>
      <p class="sub">Your groups</p>
      <ul class="list" id="groupList"></ul>
      <p class="sub" id="memberLabel">Members</p>
      <ul id="userList"></ul>
    </aside>

    <main class="chat">
      <header>
        <button type="button" class="ghost icon small" id="menuBtn" aria-label="Show groups">☰</button>
        <div class="title">
          <strong id="groupTitle">FriendChat</strong>
          <span id="groupSub" class="typing muted"></span>
        </div>
        <div class="header-actions">
          <button type="button" class="ghost icon small" id="manageBtn" aria-label="Group settings" hidden>⚙️</button>
          <button type="button" class="profile-btn" id="profileBtn" aria-label="Edit your profile"></button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer">
        <button type="button" class="ghost icon" id="photoBtn" aria-label="Send a picture">📷</button>
        <input id="photoInput" type="file" accept="image/*" hidden />
        <input id="msgInput" placeholder="Say something nice…" autocomplete="off" maxlength="1000" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
